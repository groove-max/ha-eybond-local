# Dedicated pytest config for the REAL Home Assistant integration tests.
#
# It exists so this suite does NOT inherit the repository-root pytest.ini, which
# disables the Home Assistant plugin (`-p no:homeassistant`) because ~12 modules
# under tests/ install fake `homeassistant.*` packages into sys.modules. Those
# fakes are exactly what these tests must never see: here the plugin is REQUIRED
# and the real `homeassistant` package must be imported.
#
# Run it explicitly from the repository root (so `import custom_components`
# resolves and Home Assistant's loader can discover the integration):
#   pytest -c tests_ha/pytest.ini tests_ha
#
# No global warning filters are configured on purpose: Home Assistant deprecation
# warnings must stay visible, since surfacing them is a point of this job.
[pytest]
asyncio_mode = auto
addopts = -p homeassistant
